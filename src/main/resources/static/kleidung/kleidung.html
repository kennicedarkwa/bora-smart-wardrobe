<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kleidungsstücke</title>
    <link rel="stylesheet" href="kleidung.css">
    <link rel="stylesheet" href="/darkmode.css">
    <link rel="stylesheet" href="../mobile.css">
</head>
<body>

<header>
    <div class="nav-left">
        <a href="../weather.html">WETTER</a>
        <a href="../washkorb.html">WÄSCHEKORB</a>
        <a href="../dashboard.html">DASHBOARD</a>
    </div>
    <div class="nav-right">
        <a href="../favoriten.html">FAVORITE-OUTFITS</a>

        <a href="../benutzer/profil.html">MEIN PROFIL</a>

        <a href="../einstellungen.html" class="settings-icon" title="Einstellungen" style="text-decoration: none; font-size: 24px;">⚙️</a>
    </div>
</header>

<div class="wrapper">
    <!-- Zurück zu einem einzigen Container mit dem Blue Polka Dot Design -->
    <div class="container main-container">

        <h2>deine kleidungsstücke</h2>

        <div class="actions">
            <button id="neuBtn">Neu hinzufügen</button>
        </div>

        <div class="filter-bar">
            <select id="filterKategorie">
                <option value="">Kategorie</option>
                <option>OBERTEIL</option>
                <option>UNTERTEIL</option>
                <option>SCHUHE</option>
                <option>KOPFBEDECKUNG</option>
                <option>GANZKOERPER</option>
                <option>ACCESSOIRES</option>
            </select>

            <select id="filterAnlass">
                <option value="">Anlass</option>
                <option>ALLTAG</option>
                <option>FITNESS</option>
                <option>ELEGANT</option>
            </select>

            <select id="filterStatus">
                <option value="">Status</option>
                <option value="verfuegbar">verfügbar</option>
                <option value="waeschekorb">im Wäschekorb</option>
            </select>

            <select id="filterWarm">
                <option value="">Wärmeindex</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
            </select>

            <input id="filterName" placeholder="Name suchen…">
        </div>

        <!-- Hier landen die generierten Karten direkt im Container -->
        <div id="kleidungListe" class="grid">
            <p class="placeholder">Noch keine Kleidungsstücke geladen…</p>
        </div>

    </div>
</div>

<div id="popupNeu" class="popup hidden">
    <div class="popup-content broad-popup">
        <h3>Neues Kleidungsstück hinzufügen</h3>

        <div class="form-group">
            <label for="neuName">Name des Kleidungsstücks:</label>
            <input id="neuName" placeholder="z.B. Lieblings-T-Shirt">
        </div>

        <div class="form-group">
            <label>Kategorie (Pflichtfeld):</label>
            <div class="retro-btn-group" id="groupKategorie">
                <button type="button" data-value="OBERTEIL">👕 Oberteil</button>
                <button type="button" data-value="UNTERTEIL">👖 Unterteil</button>
                <button type="button" data-value="SCHUHE">👟 Schuhe</button>
                <button type="button" data-value="KOPFBEDECKUNG">🧢 Kopfbedeckung</button>
                <button type="button" data-value="GANZKOERPER">👗 Ganzkörper</button>
                <button type="button" data-value="ACCESSOIRES">🎒 Accessoires</button>
            </div>
            <input type="hidden" id="neuKategorie">
        </div>

        <div class="form-group">
            <label>Anlass (Pflichtfeld):</label>
            <div class="retro-btn-group" id="groupAnlass">
                <button type="button" data-value="ALLTAG">🏠 Alltag</button>
                <button type="button" data-value="FITNESS">💪 Fitness</button>
                <button type="button" data-value="ELEGANT">✨ Elegant</button>
            </div>
            <input type="hidden" id="neuAnlass">
        </div>

        <div class="form-group">
            <label>Geeignete Außentemperatur (Wärmeindex):</label>
            <div class="retro-btn-group" id="groupWarm">
                <button type="button" data-value="1">❄️ 1 (≤10°C)</button>
                <button type="button" data-value="2">🧥 2 (11-15°C)</button>
                <button type="button" data-value="3">☁️ 3 (16-22°C)</button>
                <button type="button" data-value="4">☀️ 4 (23-30°C)</button>
                <button type="button" data-value="5">🔥 5 (>30°C)</button>
            </div>
            <input type="hidden" id="neuWarm">
        </div>

        <div class="form-group">
            <label>Ist dieses Teil regengeeignet?</label>
            <div class="retro-btn-group" id="groupRegen">
                <button type="button" data-value="true">☔ Ja</button>
                <button type="button" data-value="false">☀️ Nein</button>
            </div>
            <input type="hidden" id="neuRegen">
        </div>

        <div class="form-group">
            <label>Foto hinzufügen (Kamera oder Galerie):</label>
            <div class="file-upload-wrapper">
                <input type="file" id="neuBildFile" accept="image/*,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff,.heic,.heif" style="display: none;">
                <button type="button" id="wähleBildBtn">📸 Foto auswählen</button>
                <span id="bildNameLabel">Kein Foto ausgewählt</span>
            </div>
            <div id="bildPreviewBox" class="image-preview-box hidden">
                <img id="bildPreview" alt="Vorschau">
                <button type="button" id="bildEntfernenBtn">Bild entfernen</button>
            </div>
        </div>

        <div class="popup-actions">
            <button id="speichernNeu">Speichern</button>
            <button onclick="closePopup()">Abbrechen</button>
        </div>
    </div>
</div>

<div id="popupDetails" class="popup hidden">
    <div class="popup-content" id="detailsContent"></div>
</div>

<script src="kleidung.js"></script>
</body>
</html>
