<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Registrierung</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/darkmode.css">
</head>
<body>

<div class="register-card">

    <h1>Konto erstellen</h1>
    <p style="margin-bottom: 20px;">
        <a href="../homepage/homepage.html">← Zurück zur Startseite</a>
    </p>

    <label>Vorname</label>
    <input type="text" id="vorname" placeholder="Dein Vorname">

    <label>Nachname</label>
    <input type="text" id="nachname" placeholder="Dein Nachname">

    <label>Email</label>
    <input type="email" id="email" placeholder="beispiel@mail.de">

    <label>Passwort</label>
    <div class="passwort-wrapper">
        <input type="password" id="passwort" placeholder="Passwort">
        <button type="button" id="togglePasswort1" class="passwort-toggle-btn" onclick="togglePasswortSichtbarkeit('passwort', 'togglePasswort1')">👁️</button>
    </div>

    <label>Passwort wiederholen</label>
    <div class="passwort-wrapper">
        <input type="password" id="passwort2" placeholder="Passwort wiederholen">
        <button type="button" id="togglePasswort2" class="passwort-toggle-btn" onclick="togglePasswortSichtbarkeit('passwort2', 'togglePasswort2')">👁️</button>
    </div>

    <button onclick="registerUser()">Registrieren</button>

    <p id="error" class="error"></p>

    <p class="login-link">
        Bereits ein Konto?
        <a href="login.html">Zum Login</a>
    </p>

</div>

<script src="register.js"></script>
</body>
</html>
