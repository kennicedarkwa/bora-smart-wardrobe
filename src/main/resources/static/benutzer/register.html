<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Registrierung</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="register-card">

    <h1>Konto erstellen</h1>

    <label>Vorname</label>
    <input type="text" id="vorname" placeholder="Dein Vorname">

    <label>Nachname</label>
    <input type="text" id="nachname" placeholder="Dein Nachname">

    <label>Email</label>
    <input type="email" id="email" placeholder="beispiel@mail.de">

    <label>Passwort</label>
    <input type="password" id="passwort" placeholder="Passwort">

    <label>Passwort wiederholen</label>
    <input type="password" id="passwort2" placeholder="Passwort wiederholen">

    <button onclick="registerUser()">Registrieren</button>

    <p id="error" class="error"></p>

    <p class="login-link">
        Bereits ein Konto?  
        <a href="login.html">Zum Login</a>
    </p>

</div>

<script src="register.js"></script>
</body>
</html>
