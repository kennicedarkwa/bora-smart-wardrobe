<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Profil</title>
    <link rel="stylesheet" href="profil.css">
</head>
<body>

<header class="main-header">
    <div class="header-left">
        <a href="../kleidung/kleidung.html" class="nav-link">Kleiderschrank</a>
        <a href="../washkorb.html" class="nav-link">Wäschekorb</a>
        <a href="../dashboard.html" class="nav-link">Dashboard</a>
        <a href="../weather.html" class="nav-link">Wetter</a>
    </div>
    <div class="header-right">
        <a href="profil.html" class="nav-link">Mein Profil</a>
        <button class="settings-btn" onclick="openSettings()" title="Einstellungen">⚙️</button>
        <button onclick="logout()" class="logout-btn">Ausloggen</button>
    </div>
</header>

<div class="app-container">
    <h1 class="brand-title">Dein Profil</h1>

    <div class="profile-card">
        <div class="data-row">
            <label for="vorname" class="label">Vorname:</label>
            <input type="text" id="vorname" class="profile-data-box">
        </div>
        <div class="data-row">
            <label for="nachname" class="label">Nachname:</label>
            <input type="text" id="nachname" class="profile-data-box">
        </div>
        <div class="data-row">
            <label for="email" class="label">Email:</label>
            <input type="email" id="email" class="profile-data-box">
        </div>
        <button onclick="profilSpeichern()" class="save-btn">Daten speichern</button>
    </div>

    <div class="pattern-divider"></div>

    <div class="action-section">
        <h3>Passwort ändern</h3>
        <input type="password" id="neuPasswort" placeholder="Neues Passwort">
        <button onclick="passwortAendern()">Ändern</button>
    </div>

    <div class="pattern-divider"></div>

    <div class="action-section">
        <button onclick="accountLoeschen()" class="delete-btn">Account löschen</button>
    </div>

    <p id="error" class="error-msg"></p>
</div>

<script src="profil.js"></script>
</body>
</html>
