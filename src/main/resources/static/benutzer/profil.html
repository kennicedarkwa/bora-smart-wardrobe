<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Profil</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

<h1>Dein Profil</h1>

<div class="container">
    <p><strong>Vorname:</strong> <span id="vorname"></span></p>
    <p><strong>Nachname:</strong> <span id="nachname"></span></p>
    <p><strong>Email:</strong> <span id="email"></span></p>

    <h3>Passwort ändern</h3>
    <input type="password" id="neuPasswort" placeholder="Neues Passwort">
    <button onclick="passwortAendern()">Ändern</button>

    <h3>Account löschen</h3>
    <button onclick="accountLoeschen()" style="background:red;">Account löschen</button>

    <button onclick="logout()">Logout</button>

    <p id="error" class="error"></p>
</div>

<script src="profil.js"></script>
</body>
</html>
