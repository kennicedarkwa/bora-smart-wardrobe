<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/darkmode.css">
</head>
<body>

<h1>Login</h1>
<p style="text-align: center;">
    <a href="../homepage/homepage.html">← Zurück zur Startseite</a>
</p>

<div class="container">
    <label for="email">E-Mail-Adresse:</label>
    <input type="email" id="email" placeholder="beispiel@mail.de">

    <label for="passwort">Passwort:</label>
    <div class="passwort-wrapper">
        <input type="password" id="passwort" placeholder="Dein Passwort">
        <button type="button" id="togglePasswort" class="passwort-toggle-btn" onclick="togglePasswortSichtbarkeit()">👁️</button>
    </div>

    <button onclick="login()">Einloggen</button>

    <p id="error" class="error"></p>
</div>

<script src="login.js"></script>
</body>
</html>
