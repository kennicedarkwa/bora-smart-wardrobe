<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>BORA Wetter App</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>

<header>
    <h1>WETTER</h1>
    <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/kleidung/kleidung.html">Kleidung</a>
        <a href="/weather.html">Wetter</a>
        <a href="/anlass.html">Anlass</a>
        <a href="/empfehlung.html">Empfehlung</a>
        <a href="/outfit/outfit.html">Outfit</a>
        <a href="/washkorb.html">Wäschekorb</a>
        <a href="/benutzer/profil.html">Profil</a>
    </nav>
</header>

<div class="app-container">
    <h1 class="brand-title">BORA</h1>

    <div class="search-form">
        <div>
            <label for="city">Stadt</label>
            <input type="text" id="city" placeholder="z.B. Hamburg" value="Hamburg">
        </div>
        <div>
            <label for="date">Datum</label>
            <input type="date" id="date" value="2026-06-12">
        </div>

        <button onclick="loadWeather()">Wetter abfragen</button>
    </div>

    <div id="result">
        <em>Wählen Sie eine Stadt und ein Datum aus...</em>
    </div>
</div>

<script src="weather.js"></script>
</body>
</html>
