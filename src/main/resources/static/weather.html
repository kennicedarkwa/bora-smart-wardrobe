<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>BORA Weather App</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>

<div class="app-container">
    <h1 class="brand-title">BORA</h1>

    <div class="search-form">
        <div>
            <label for="city">Stadt</label>
            <input type="text" id="city" placeholder="z.B. Hamburg" value="Hamburg">
        </div>
        <div>
            <label for="date">Datum</label>
            <input type="date" id="date" value="2026-06-12">
        </div>

        <button onclick="loadWeather()">Wetter abfragen</button>
    </div>

    <div id="result">
        <em>Wählen Sie eine Stadt und ein Datum aus...</em>
    </div>
</div>

<script src="weather.js"></script>
</body>
</html>
