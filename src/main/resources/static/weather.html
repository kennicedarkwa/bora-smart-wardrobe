<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>BORA Weather App</title>
    <link rel="stylesheet" href="weather.css">
    <link rel="stylesheet" href="darkmode.css">
</head>
<body>

<!-- Neues, durchgehendes Header-Dashboard (Stil von color-hex) -->
<!-- Durchgehender Color-Hex-Style Header mit allen Dashboard-Links -->
<header class="main-header">
    <div class="header-left">
        <a href="kleidung/kleidung.html" class="nav-link">KLEIDERSCHRANK</a>
        <a href="washkorb.html" class="nav-link">WÄSCHEKORB</a>
        <a href="dashboard.html" class="nav-link">DASHBOARD</a>
    </div>

    <div class="header-right">
        <a href="favoriten.html" class="nav-link">FAVORITE-OUTFITS</a>

        <a href="benutzer/profil.html" class="nav-link">Mein Profil</a>
        <a href="einstellungen.html" class="settings-icon" title="Einstellungen">⚙️</a>
        <button class="logout-btn" onclick="logout()">Ausloggen</button>
    </div>
</header>

<!-- Hier drunter kommt dein gewohnter .app-container -->


<div class="app-container">
    <h1 class="brand-title">BORA</h1>

    <div class="search-form">
        <div>
            <label for="city">Stadt</label>
            <input type="text" id="city" placeholder="z.B. Hamburg" value="Hamburg">
        </div>
        <div>
            <label for="date">Datum</label>
            <input type="date" id="date" value="2026-06-12">
        </div>

        <div>
            <label for="occasion">Anlass</label>
            <select id="occasion">
                <option value="ALLTAG">Casual (Alltag)</option>
                <option value="ELEGANT">Fine wear (Elegant)</option>
                <option value="FITNESS">Sport (Fitness)</option>
            </select>
        </div>

        <button onclick="loadWeather()">Wetter abfragen</button>
        <button onclick="goToRecommendation()" style="background-color: #a78bfa; margin-top: 5px;">Empfehlung anzeigen !</button>
    </div>

    <div id="result">
        <em>Wählen Sie eine Stadt, ein Datum und einen Anlass aus...</em>
    </div>
</div>

<script src="weather.js"></script>
</body>
</html>
