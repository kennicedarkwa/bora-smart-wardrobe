    <link rel="stylesheet" href="darkmode.css">
    <link rel="stylesheet" href="mobile.css">
</head>
<body>

<header>
    <div class="nav-left">
        <a href="../dashboard.html">DASHBOARD</a>
        <a href="../kleidung/kleidung.html">KLEIDERSCHRANK</a>
        <a href="../washkorb.html">WÄSCHEKORB</a>
    </div>
    <div class="nav-right">
        <!-- HIER IST DER NEUE LINK: -->
        <a href="../favoriten.html">FAVORITE-OUTFITS</a>

        <a href="../benutzer/profil.html">MEIN PROFIL</a>
        <a href="einstellungen.html">⚙️</a>
        <a href="../index.html">AUSLOGGEN</a>
    </div>
</header>

<div class="wrapper">
    <div class="container" style="max-width: 800px;">
        <h2 style="background-color: #fff; display: inline-block; padding: 5px 15px; border: 3px solid #000; box-shadow: 6px 6px 0px #000;">einstellungen</h2>
        <p class="subtitle" style="background-color: #fff; padding: 5px 10px; border: 2px solid #000; margin-bottom: 30px; font-weight: bold; width: fit-content;">Personalisiere deinen digitalen Kleiderschrank</p>

        <form id="settingsForm">

            <div class="setting-card">
                <div class="form-group">
                    <label for="standardStandort">Standard-Standort für Wetterdaten</label>
                    <input type="text" id="standardStandort" placeholder="z.B. Hamburg">
                </div>
            </div>

            <div class="setting-card setting-row">
                <div class="setting-info">
                    <h3>Dark Mode</h3>
                    <p>Wechselt zu einem dunklen Design (schont die Augen).</p>
                </div>
                <input type="checkbox" id="darkModeToggle" class="retro-checkbox">
            </div>

            <div class="setting-card setting-row">
                <div class="setting-info">
                    <h3>Wascherinnerung</h3>
                    <p>Zeigt ein Popup auf dem Dashboard, wenn du waschen solltest.</p>
                </div>
                <input type="checkbox" id="waescheErinnerungAktiv" class="retro-checkbox">
            </div>

            <div class="setting-card">
                <div class="form-group" id="waescheLimitGroup">
                    <label for="waescheLimit">Wäsche-Limit (Anzahl der Teile)</label>
                    <input type="number" id="waescheLimit" min="1" max="50" placeholder="z.B. 10">
                </div>
            </div>

            <div class="button-group">
                <button type="button" id="btnReset" class="btn-secondary">STANDARDWERTE</button>
                <button type="submit" id="btnSave" class="btn-primary">SPEICHERN</button>
            </div>

        </form>

        <div id="statusMessage" class="status-message" style="display: none;"></div>
    </div>
</div>

<script src="einstellungen.js"></script>
</body>
</html>
