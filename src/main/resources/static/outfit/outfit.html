<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outfit Zusammenstellung</title>

    <link rel="stylesheet" href="outfit.css">
    <link rel="stylesheet" href="/darkmode.css">
    <link rel="stylesheet" href="../mobile.css">

    <style>
        .kleidungsstueck {
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            background-color: #fafafa;
            color: black;
        }

        .infoBox {
            margin-top: 15px;
            padding: 10px;
            background-color: #ffcc00;
            color: black;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-left">
        <a href="/kleidung/kleidung.html" class="nav-link">KLEIDERSCHRANK</a>
        <a href="/washkorb.html" class="nav-link">WÄSCHEKORB</a>
        <a href="/dashboard.html" class="nav-link">DASHBOARD</a>
    </div>

    <div class="header-right">
        <a href="/favoriten.html" class="nav-link">FAVORITE-OUTFITS</a>

        <a href="/benutzer/profil.html" class="nav-link">Mein Profil</a>
        <button class="settings-btn" onclick="openSettings()" title="Einstellungen">⚙️</button>
        <button class="logout-btn" onclick="logout()">Ausloggen</button>
    </div>
</header>

<div class="wrapper">
    <div class="container">

        <h1>Dein Outfit</h1>

        <div id="outfitListe"></div>

        <div id="infoBox" class="infoBox" style="display:none;">
            ⚠️ Ups: Daten nicht verbunden
        </div>

        <div id="favoritenBereich" style="margin-top: 40px; border-top: 3px dashed #000000; padding-top: 25px;">
            <label for="favoritName" style="font-family: 'Courier New', monospace; font-weight: bold; display: block; margin-bottom: 10px;">Outfit-Name für deine Favoriten:</label>
            <input type="text" id="favoritName" placeholder="z. B. Sommer Look 2026" style="font-family: 'Courier New', monospace; font-weight: bold; padding: 10px; width: 100%; max-width: 300px; border: 2px solid #000000; box-shadow: 3px 3px 0px #000000; margin-bottom: 15px; box-sizing: border-box;">
            <br>
            <button onclick="speichereAlsFavorit()" style="font-family: 'Courier New', monospace; font-weight: bold; padding: 10px 20px; background-color: #b4c6fc; border: 2px solid #000000; box-shadow: 4px 4px 0px #000000; cursor: pointer;">★ Als Favorit speichern</button>
        </div>

    </div>
</div>

<script src="outfit.js"></script>
</body>
</html>
