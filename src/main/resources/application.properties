spring.application.name=demo
server.port=1531
app.greeting= Bora! Immer für dich da


# Web Login Credentials for Development
spring.security.user.name=admin
spring.security.user.password=password123


# H2 Database Configuration (persistente Datei)
spring.datasource.url=jdbc:h2:file:./data/badminton-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=never
# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

