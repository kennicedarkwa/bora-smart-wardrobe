spring.application.name=demo
server.port=1531
app.greeting=Bora! Immer für dich da


# LOKALE KONFIGURATION (Aktiv für das Testen )
# Datenbank: Lokale H2 aktivieren
spring.datasource.url=jdbc:h2:file:./data/badminton-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Foto-Upload & Python: Lokale Pfade für Kleidungsstück erstellen + Bild hochladen
app.storage.upload-dir=${UPLOAD_DIR:/app/uploads}
#app.storage.upload-dir=${UPLOAD_DIR:/data/uploads}
#app.storage.upload-dir=uploads
app.storage.python-bin=python3
app.storage.python-script=scripts/remove_bg.py



