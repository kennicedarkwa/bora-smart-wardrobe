stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest

  only:
    - main

  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$SSH_PRIVATE_KEY"
    - head -n 1 "$SSH_PRIVATE_KEY"
    - tail -n 1 "$SSH_PRIVATE_KEY"
    - ssh-keygen -y -f "$SSH_PRIVATE_KEY" > /dev/null

  script:
    - |
      ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no tornakjian@141.22.167.202 "
        cd /home/tornakjian/sea2_projekt &&
        git pull origin main &&
        docker compose up -d --build
      "