services:
  app:
    build: .
    container_name: bora-app
    ports:
      - "1531:1531"
    networks:
      - bora_net
    environment:
      UPLOAD_DIR: /app/uploads
      PYTHON_BIN: python3
      PYTHON_SCRIPT: /app/scripts/remove_bg.py
    volumes:
      - /home/tornakjian/bora/uploads:/app/uploads
    restart: unless-stopped

networks:
  bora_net:
    external: true